<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found: Cadzz</title>
<meta name="description" content="That page does not exist on the Cadzz website.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/styles.css">
<script>
(function () {
  var d = document.documentElement;
  d.classList.add('js');
  try {
    var t = localStorage.getItem('cadzz-theme');
    if (t === 'light' || t === 'dark') { d.setAttribute('data-theme', t); }
  } catch (e) {}
})();
</script>
</head>
<body>
<main id="main">
  <div class="wrap error-page">
    <p class="error-page__code" aria-hidden="true">404</p>
    <h1 class="error-page__title">Page not found</h1>
    <p class="error-page__text">That page does not exist. It may have moved, or the link may be wrong.</p>
    <div class="error-page__actions">
      <a class="btn btn--primary" href="/index.html">Back to home</a>
    </div>
  </div>
</main>
</body>
</html>
